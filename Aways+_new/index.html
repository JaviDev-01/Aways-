<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0066FF" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>AWAYS+ | Tech Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #0066ff;
        --secondary: #000000;
        --surface: #ffffff;
        --bg: #f8faff;
        --text: #000000;
        --text-muted: rgba(0, 0, 0, 0.4);
        --border: #000000;
        --card-bg: #ffffff;
        --progress-bg: #f1f5f9;
      }

      .dark-mode {
        --bg: #050505;
        --surface: #121212;
        --secondary: #ffffff;
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.4);
        --border: #262626;
        --card-bg: #161616;
        --progress-bg: #1a1a1a;
      }

      body {
        font-family: "Bricolage Grotesque", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        user-select: none;
        padding-bottom: env(safe-area-inset-bottom);
        transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          color 0.4s ease;
      }

      .neo-shadow {
        box-shadow: 4px 4px 0px 0px var(--secondary);
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .neo-shadow:active {
        box-shadow: 0px 0px 0px 0px var(--secondary);
        transform: translate(2px, 2px);
      }
      .neo-shadow-sm {
        box-shadow: 2px 2px 0px 0px var(--secondary);
      }

      .bg-primary {
        background-color: var(--primary) !important;
      }
      .text-primary {
        color: var(--primary) !important;
      }
      .border-primary {
        border-color: var(--primary) !important;
      }
      .bg-surface {
        background-color: var(--card-bg) !important;
      }
      .border-main {
        border-color: var(--border) !important;
      }
      .text-main {
        color: var(--text) !important;
      }
      .bg-progress {
        background-color: var(--progress-bg) !important;
      }

      .bg-progress {
        background-color: var(--progress-bg) !important;
      }

      /* Safe Area Utilities */
      .pt-app-container {
        padding-top: calc(1.5rem + env(safe-area-inset-top));
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Dark Mode Form Visibility Fixes */
      input, select, textarea {
        background-color: var(--surface);
        color: var(--text);
        accent-color: var(--primary);
      }

      input::placeholder {
        color: var(--text-muted);
        opacity: 0.5;
      }

      .dark-mode input, .dark-mode select, .dark-mode textarea {
        border-color: var(--border);
        color: #ffffff !important;
      }

      @keyframes pulse-custom {
        0% {
          box-shadow: 0 0 0 0 rgba(var(--primary-rgb), 0.4);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(var(--primary-rgb), 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(var(--primary-rgb), 0);
        }
      }
      .pulse-blue {
        animation: pulse-custom 2s infinite;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--primary)',
              surface: 'var(--surface)',
              main: 'var(--secondary)',
              bg: 'var(--bg)',
              'progress-bg': 'var(--progress-bg)'
            }
          }
        }
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://aistudiocdn.com/react@^19.2.1/",
          "react": "https://aistudiocdn.com/react@^19.2.1",
          "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
          "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
